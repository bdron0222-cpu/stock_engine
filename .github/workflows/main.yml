name: Stock Engine Automation

on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '0 1 * * 1'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pandas-ta --ignore-requires-python

      - name: Patch pandas-ta syntax error
        run: |
          python3 -c "
          import site, os
          for path in site.getsitepackages():
              hma_path = os.path.join(path, 'pandas_ta', 'overlap', 'hma.py')
              if os.path.exists(hma_path):
                  with open(hma_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  if 'hma.name = f' in content and '\"\"' in content:
                      new_content = content.replace('f\"HMA{\"\"', \"f'HMA{''\")
                      with open(hma_path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      print('Patched successfully')
                  break
          "

      - name: Run Fetcher & Monitor
        run: |
          if [ ! -f "stocks_list.csv" ] || [ "${{ github.event.schedule }}" == "0 1 * * 1" ]; then
            python data_loader/fetch_stock_list.py
          fi
          python market_monitor.py
          python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          touch watchlist_conservative.csv watchlist_aggressive.csv watchlist_noise.csv all_candidates_proximity.csv stocks_list.csv market_state.json
          git add -f watchlist_conservative.csv watchlist_aggressive.csv watchlist_noise.csv all_candidates_proximity.csv stocks_list.csv market_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新: 每日選股結果" && git push)
